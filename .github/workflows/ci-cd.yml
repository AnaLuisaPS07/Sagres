name: CI/CD — SAGRES Monitoria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:

  # ──────────────────────────────────────────────
  # 1) Testes automatizados do backend (JUnit/Mockito)
  # ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar testes (Maven)
        working-directory: backend
        run: mvn -B test

  # ──────────────────────────────────────────────
  # 2) Lint + build do frontend (análise estática do JS)
  # ──────────────────────────────────────────────
  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────
  # 3) Análise estática de segurança (CodeQL) — Java e JavaScript
  # ──────────────────────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ['java', 'javascript']
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # O autobuild genérico do CodeQL só procura pom.xml/build.gradle na
      # raiz do repositório, mas o nosso está em backend/. Por isso builda-
      # mos o Java manualmente, apontando pra pasta certa.
      - name: Build manual (Java)
        if: matrix.language == 'java'
        working-directory: backend
        run: mvn -B clean compile -DskipTests

      - name: Autobuild (JavaScript)
        if: matrix.language == 'javascript'
        uses: github/codeql-action/autobuild@v3

      - name: Rodar análise
        uses: github/codeql-action/analyze@v3

  # ──────────────────────────────────────────────
  # 4) Teste dinâmico: sobe a aplicação de verdade e ataca ela (DAST)
  # ──────────────────────────────────────────────
  dynamic-test:
    runs-on: ubuntu-latest
    needs: [backend-test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sagres_db
          POSTGRES_USER: sagres_user
          POSTGRES_PASSWORD: sagres_pass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sagres_user -d sagres_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports: ['1025:1025', '8025:8025']

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar aplicação
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Subir aplicação em segundo plano
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sagres_db
          SPRING_DATASOURCE_USERNAME: sagres_user
          SPRING_DATASOURCE_PASSWORD: sagres_pass
          SAGRES_JWT_SECRET: 'chave-de-teste-apenas-para-ci-nao-usar-em-producao-1234567890'
          SAGRES_JWT_EXPIRATION_MS: '3600000'
          SAGRES_FRONTEND_URL: 'http://localhost:5173'
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: '1025'
          SAGRES_CORS_ALLOWED_ORIGINS: 'http://localhost:5173'
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo "Aguardando a aplicação subir..."
          READY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 2
          done
          echo "----- Log da aplicação -----"
          cat app.log
          if [ "$READY" != "true" ]; then
            echo "A aplicação não respondeu a tempo. Abortando o job."
            exit 1
          fi

      - name: Varredura dinâmica (OWASP ZAP Baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'
          fail_action: false

  # ──────────────────────────────────────────────
  # 5) Publica imagens no GHCR — ambiente STAGING
  #    Roda automaticamente a cada push na main.
  # ──────────────────────────────────────────────
  publish-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-lint-build, codeql, dynamic-test]
    environment:
      name: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar nome do repositório (minúsculo, exigido pelo GHCR)
        run: echo "IMAGE_BASE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push — backend (staging)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:staging
            ${{ env.IMAGE_BASE }}-backend:staging-${{ github.sha }}

      - name: Build e push — frontend (staging)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:staging
            ${{ env.IMAGE_BASE }}-frontend:staging-${{ github.sha }}

  # ──────────────────────────────────────────────
  # 6) Publica imagens no GHCR — ambiente PRODUCTION
  #    Só libera após aprovação manual (configurada nas
  #    proteções do Environment "production" no GitHub).
  # ──────────────────────────────────────────────
  publish-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-staging]
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar nome do repositório (minúsculo, exigido pelo GHCR)
        run: echo "IMAGE_BASE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push — backend (production)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:production
            ${{ env.IMAGE_BASE }}-backend:latest

      - name: Build e push — frontend (production)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:production
            ${{ env.IMAGE_BASE }}-frontend:latest